# A minimal user crate: its build.rs builds the counter model with simjig-build and its
# main runs it through a tiny hand-written C shim. The integration test copies this
# directory, points the simjig-build path at the crate under test, and runs it.
[package]
name = "simjig-fixture-counter"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
simjig-build = { path = "../../.." }

# Not part of the simjig workspace.
[workspace]
