[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# trybuild UI tests compile a crate against simjig; on a cold cache that alone takes
# minutes, so they get 10 minutes instead of 2. Every profile inherits this override.
[[profile.default.overrides]]
filter = "test(/^ui::/)"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
# The simulator is deterministic: a flaky test is a bug, so never retry.
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
