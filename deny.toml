[advisories]
yanked = "deny"

[licenses]
# Add licenses here only when a dependency actually needs them.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]  # Unicode-3.0: unicode-ident (via thiserror)

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
