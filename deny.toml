[advisories]
yanked = "deny"

[licenses]
# Add licenses here only when a dependency actually needs them.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (`svtypes`, `simjig-bits`) carry no version; every
# crate is `publish = false`, so they can never reach a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
