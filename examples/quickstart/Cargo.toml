[package]
name = "quickstart"
description = "The smallest simjig project: two tiny designs, a build script and tests."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
simjig.workspace = true

[build-dependencies]
simjig-build.workspace = true

# A testbench's lints: the repository's, except that tests may unwrap and need no docs.
# Cargo cannot extend `workspace = true` with local entries, so the table lists them all.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "allow"
expect_used = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
rc_buffer = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
