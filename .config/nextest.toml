[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# The simulator is deterministic: a flaky test is a bug, so never retry.
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# The trybuild UI test compiles simjig and its proc-macro dependencies in a nested cargo
# (`<target>/tests/trybuild`); on a cold target that alone can take minutes on a slow
# machine. A backstop: its build script already skips the test models there.
[[profile.default.overrides]]
filter = 'binary_id(simjig::harness_tests) & test(/^ui::/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The `rebuild::` tests build one copy of a fixture crate with Cargo (tests/it/rebuild.rs),
# from cold in a fresh target dir: each may take minutes. They run one at a time, so a
# test's clock does not run while it waits for the other's build.
[test-groups]
fixture-rebuild = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^rebuild::/)'
test-group = 'fixture-rebuild'
slow-timeout = { period = "60s", terminate-after = 6 }
