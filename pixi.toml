
# Non-Rust tools, locked for every platform in pixi.lock. Rust itself is pinned by
# rust-toolchain.toml. Verilator generates C++ that is compiled on every model build, so
# the C++ compiler is pinned here too.
[workspace]
channels = ["conda-forge"]
name = "simjig"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
verilator = "==5.52"
cxx-compiler = ">=2.0.0,<3"
ccache = ">=4.14.1,<5"
make = ">=4.4.1,<5"
lz4-c = ">=1.10.0,<2"
zlib = ">=1.3.2,<2"

[tasks]
duts-lint = { cmd = "bash tests/duts/lint.sh", description = "Lint every design in tests/duts with Verilator -Wall" }

# Golden-reference environment for the scheduler conformance suite (tests/conformance).
# Kept out of the default environment: only `pixi run -e conformance ...` installs Python.
# cocotb comes from PyPI because conda-forge builds it for linux-64 only.
[feature.conformance.dependencies]
python = "3.12.*"

[feature.conformance.pypi-dependencies]
cocotb = "==2.1.0"

[feature.conformance.tasks]
duts-smoke = { cmd = "python tests/duts/smoke/run.py", description = "Build every shared DUT and run its cocotb smoke test" }
conformance-regen = { cmd = "python tests/conformance/regen.py", description = "Regenerate the cocotb goldens in tests/conformance/golden" }

[environments]
conformance = { features = ["conformance"] }
