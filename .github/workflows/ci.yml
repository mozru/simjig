name: ci

# Runs on a self-hosted runner (the maintainer's Mac). Only trusted events trigger it:
# pushes to this repository and pull requests from branches of this repository.
# Pull requests from forks never run here, because they would execute arbitrary code
# on the maintainer's machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
      - name: Pinned non-Rust tools (Verilator, C++ compiler, ccache)
        run: |
          export PATH="$HOME/.pixi/bin:$PATH" PIXI_NO_TELEMETRY=1
          pixi install --locked
      - name: Gate (same as `pixi run cargo xtask ci` locally)
        run: |
          export PATH="$HOME/.pixi/bin:$HOME/.cargo/bin:$PATH" PIXI_NO_TELEMETRY=1
          pixi run cargo xtask ci
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
